:root{--bg:#f5f5f5;--tile:#e6e6e5;--ink:#111;--mute:#80807e;--line:#d4d4d2;color-scheme:light;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(var(--hh,52px) + 8px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0;font-synthesis:none}
body{background:var(--bg);color:var(--ink);font:12px/1.65 "Lucida Console",Consolas,monospace;letter-spacing:.01em;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:11}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:10;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 24px;height:52px;border-bottom:1px solid var(--line)}
nav{display:flex;gap:26px;justify-content:center}
nav a,footer a{color:var(--mute);transition:color .15s}
nav a:hover,nav a[aria-current],footer a:hover,footer a[aria-current]{color:var(--ink)}
nav a[aria-current]{border-bottom:1px solid var(--ink)}
.lang{position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:108px;height:26px;border:1px solid var(--ink);border-radius:13px;overflow:hidden;justify-self:end}
.lang i{position:absolute;top:0;bottom:0;left:0;width:33.334%;background:var(--ink);transition:transform .25s ease}
.lang button{position:relative;background:none;border:0;font:inherit;font-size:11px;color:var(--ink);cursor:pointer;transition:color .25s}
.lang button[aria-pressed=true]{color:var(--bg)}
main{flex:1;padding-top:calc(var(--hh,52px) + env(safe-area-inset-top,0px))}
section{display:none;padding:28px 24px 64px}
section.on{display:block}
h1{font-size:12px;font-weight:400;margin-bottom:28px;color:var(--mute)}
.hero{height:calc(100vh - var(--hh,52px) - 56px - env(safe-area-inset-top,0px));min-height:360px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.hero .sea{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10vw,150px);letter-spacing:.1em;color:rgba(245,245,245,.34);white-space:nowrap;pointer-events:none;z-index:2}
#home{padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px}
.card{background:var(--tile);aspect-ratio:3/4;position:relative;display:block}
.shape{position:absolute;inset:18% 22% 30%;background:var(--bg);opacity:.8;transition:opacity .2s}
.card:hover .shape{opacity:1}
.jar .shape{inset:27% 30% 25%;border-radius:8px}
.jar .shape::before{content:"";position:absolute;left:12%;right:12%;top:-10%;height:12%;background:inherit;border-radius:4px 4px 0 0}
.jar .shape::after{content:"";position:absolute;left:14%;right:14%;top:36%;height:24%;border:1px solid var(--tile)}
.bot .shape{inset:26% 34% 24%;border-radius:12px 12px 8px 8px}
.bot .shape::before{content:"";position:absolute;left:30%;right:30%;top:-12%;height:14%;background:inherit;border-radius:4px 4px 0 0}
.bot .shape::after{content:"";position:absolute;left:14%;right:14%;top:40%;height:26%;border:1px solid var(--tile)}
.hero.blk{background:#000;position:relative}
.lw{position:relative;width:min(100%,calc((100vh - var(--hh,52px) - 56px)*1.336));aspect-ratio:1368/1024;line-height:0}
.lw img{display:block;width:100%;height:100%}
.lw a{position:absolute;left:0;right:0;transition:background .2s}
.lw .z1{top:0;height:66%}
.lw .z2{top:66%;bottom:0}
.lw a:hover{background:rgba(255,255,255,.05)}
.card img,.pimg img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;mix-blend-mode:multiply}
.back{display:inline-block;color:var(--mute);margin-bottom:20px}
.back:hover{color:var(--ink)}
.pd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start;max-width:1100px}
.pimg{background:var(--tile);aspect-ratio:1;position:relative}
.pinfo{max-width:460px}
.pinfo h1{color:var(--ink);margin-bottom:6px}
.pp{margin-bottom:26px;font-size:20px}
.pinfo h2{font-size:12px;font-weight:400;color:var(--mute);margin-bottom:8px}
.pinfo p{margin-bottom:12px}
.pinfo ul{list-style:none;padding:0;margin:0 0 16px}
.pinfo li{padding:4px 0;border-top:1px solid var(--line)}
.pinfo .sp{color:var(--mute)}
.pinfo .pay{margin-top:12px}
.jar .meta,.bot .meta{flex-direction:column;gap:3px}
.jar .meta span:last-child,.bot .meta span:last-child{color:var(--ink);font-size:16px}
.jar.card img,.bot.card img{inset:5% 6% 24%;width:88%;height:71%}
.meta{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:12px}
.meta span:last-child{color:var(--mute);white-space:nowrap}
.text{max-width:560px}
.text h2{font-size:12px;font-weight:400;color:var(--mute);margin:28px 0 6px}
.text h2:first-of-type{margin-top:0}
.text p{margin-bottom:10px}
dl{max-width:620px}
dt{border-top:1px solid var(--line);padding:14px 0 4px;cursor:pointer;display:flex;justify-content:space-between;gap:20px}
dt::after{content:"+";color:var(--mute)}
dt[aria-expanded=true]::after{content:"–"}
dd{display:none;padding:0 0 16px;color:var(--mute);max-width:520px}
dt[aria-expanded=true]+dd{display:block}
.ord{display:flex;gap:8px;margin:16px 0 14px;max-width:420px}
.ord input{flex:1;min-width:0;background:none;border:1px solid var(--line);padding:9px 10px;font:inherit;color:var(--ink)}
.ord button{background:var(--ink);color:var(--bg);border:0;padding:0 16px;font:inherit;cursor:pointer}
.right{display:flex;align-items:center;gap:16px;justify-self:end}
.cartb{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;padding:0}
button.card{width:100%;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.add{position:absolute;left:14px;top:12px;color:var(--mute);transition:color .2s}
.card:hover .add{color:var(--ink)}
#ov{position:fixed;inset:0;background:rgba(17,17,17,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:19}
#ov.open{opacity:1;pointer-events:auto}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cart.open{transform:none;visibility:visible;transition:transform .3s ease}
.ch{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.ch button{background:none;border:0;font:inherit;font-size:18px;color:var(--ink);cursor:pointer}
.cb{flex:1;overflow-y:auto;padding:8px 20px}
.cb p{color:var(--mute);padding-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row em{font-style:normal;color:var(--mute)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:24px;height:24px;border:1px solid var(--line);background:none;font:inherit;color:var(--ink);cursor:pointer}
.cf{padding:16px 20px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;margin-bottom:12px}
.pay{width:100%;background:var(--ink);color:var(--bg);border:0;padding:12px;font:inherit;cursor:pointer}
.cf p{color:var(--mute);margin-top:10px}
.ch span,.tot,.code{text-transform:uppercase}
.cb p.em{text-align:center;text-transform:uppercase;color:var(--ink);padding:70px 0}
.tot.big{margin-top:18px}
.code{background:none;border:0;border-bottom:1px solid var(--mute);color:var(--mute);font:inherit;font-size:10px;padding:0 0 1px;cursor:pointer;margin:2px 0 16px}
.cf .ord{margin:0 0 12px}
footer{display:flex;flex-wrap:wrap;gap:8px 24px;padding:20px 24px;border-top:1px solid var(--line);font-size:11px}
footer span{color:var(--mute);margin-left:auto}
@media (max-width:1240px){
 header{grid-template-columns:1fr;height:auto;gap:8px;padding:10px 14px}
 header>span{display:none}
 .right{order:1;justify-self:end}
 nav{order:2;justify-content:center;flex-wrap:wrap;gap:4px 18px}
}
@media (max-width:760px){
 .hero{height:calc(100vh - var(--hh,90px) - 90px)}
 section{padding:18px 12px 48px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .pd{grid-template-columns:1fr;gap:20px}
 footer{padding:18px 14px}
 footer span{margin:0;flex:0 0 100%}
}
.cform{display:grid;gap:8px;max-width:420px;margin-top:22px}
.cform input,.cform textarea{background:none;border:1px solid var(--line);padding:9px 10px;font:inherit;color:var(--ink);resize:vertical;min-width:0}
.cform textarea{min-height:110px}
.cform button{background:var(--ink);color:var(--bg);border:0;padding:12px;font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

PROD.sport=[["Optimum Nutrition Micronized Creatine Powder, 360 г|Optimum Nutrition Micronized Creatine Powder, 360 g|Optimum Nutrition Micronized Creatine Powder, 360 g",350000,"cr",["Размер, сила и результат|Hajm, kuch va natija|Muscle size, strength & performance","Креатин моногидрат хорошо изучен: при регулярном приёме, сбалансированном питании и силовых тренировках он помогает поддерживать мышечную массу, силу и восстановление.|Kreatin monogidrat yaxshi o‘rganilgan: muntazam qabul qilinsa, muvozanatli ovqatlanish va kuch mashqlari bilan birga mushak hajmi, kuchi va tiklanishini qo‘llab-quvvatlashga yordam beradi.|Creatine monohydrate has been extensively studied and shown to help support muscle size, strength and recovery when used consistently over time in conjunction with a healthy, balanced diet and regular weight training.","100% чистый креатин моногидрат;5 г чистого креатина моногидрата в порции;Поддерживает ресинтез АТФ и взрывные движения;Микронизирован — легко размешивается;Проверен на запрещённые вещества|100% sof kreatin monogidrat;Bir porsiyada 5 g sof kreatin monogidrat;ATF qayta tiklanishi va portlovchi harakatlarni qo‘llab-quvvatlaydi;Mikronizatsiyalangan — oson aralashadi;Taqiqlangan moddalarga tekshirilgan|100% pure creatine monohydrate;5 grams of pure creatine monohydrate per serving;Helps support ATP recycling & explosive movements;Micronized for easy mixing;Banned substance tested","Вкус: черничный лимонад · 360 г · 60 порций|Ta’mi: ko‘k malina limonad · 360 g · 60 porsiya|Flavor: blueberry lemonade · 360 g · 60 servings"]],
["NOW Foods Creatine Monohydrate, 227 г|NOW Foods Creatine Monohydrate, 227 g|NOW Foods Creatine Monohydrate, 227 g", 220000, "now", ["Поддерживает оптимальный уровень АТФ при тренировках|Mashg‘ulot paytida ATF ning optimal darajasini qo‘llab-quvvatlaydi|Maintains optimal levels of ATP production when training", "||", "Поддерживает рост сухой мышечной массы;Без добавок и консервантов;Веган/вегетарианский, кошерный, без стероидов, без ГМО;Доступен в микронизированной форме и в капсулах|Quruq mushak massasi o‘sishini qo‘llab-quvvatlaydi;Qo‘shimchalar va konservantlarsiz;Vegan/vegetarian, koshir, steroidsiz, GMOsiz;Mikronizatsiyalangan va kapsula shaklida mavjud|Supports growth of lean muscle mass;No additives or preservatives;Vegan/vegetarian, kosher, steroid-free and non-GMO;Micronized & capsule options available", "Порошок · 227 г|Kukun · 227 g|Powder · 227 g"]],
["Archaneon Eternal Legacy Pre-Workout, 490 г|Archaneon Eternal Legacy Pre-Workout, 490 g|Archaneon Eternal Legacy Pre-Workout, 490 g", 850000, "arch", ["Создан для несокрушимых|To‘xtatib bo‘lmaydiganlar uchun yaratilgan|Built for the unstoppable", "Eternal Legacy — это не просто предтренировочный комплекс, а ваше боевое оружие. Формула для атлетов, которые требуют элитных результатов: передовая наука и чистая интенсивность. Каждая порция даёт драйв, обостряет фокус и превращает тренировку в победу. ЗАСЛУЖИ. ВЛАДЕЙ. НЕ УГАСАЙ.|Eternal Legacy — oddiy mashg‘ulotdan oldingi kompleks emas, bu sizning jang quroli. Elita darajasidagi natija talab qiladigan atletlar uchun: ilg‘or fan va sof shiddat. Har bir porsiya shijoatni oshiradi, diqqatni kuchaytiradi va mashg‘ulotni g‘alabaga aylantiradi. ARZIGANINI OL. EGA BO‘L. HECH QACHON SO‘NMA.|Eternal Legacy isn’t just a pre-workout — it’s your weapon of war. Designed for lifters who demand elite performance, this formula fuses cutting-edge science with raw intensity. Every scoop powers your drive, ignites your focus, and turns your workouts into domination. EARN IT. OWN IT. NEVER FADE.", "||", "Ноотропный предтренировочный комплекс · 490 г|Nootrop mashg‘ulotdan oldingi kompleks · 490 g|Nootropic pre-workout · 490 g"]],
["Transformers Protron Protein Blend, 907 г|Transformers Protron Protein Blend, 907 g|Transformers Protron Protein Blend, 907 g", 1050000, "pro", ["Высококачественный белковый комплекс|Yuqori sifatli oqsil kompleksi|High quality protein blend", "Protron — белковый комплекс для любой «машины». Сочетание качественного сывороточного и казеинового белка, MCT и пищеварительных ферментов создано, чтобы заряжать вашего внутреннего автобота. Готовитесь к бою или начинаете восстановление после тренировки — Protron поможет раскрыть вашу силу.|Protron — har qanday «mashina» uchun mo‘ljallangan oqsil kompleksi. Sifatli zardob va kazein oqsili, MCT va hazm fermentlari aralashmasi ichingizdagi avtobotni quvvatlantirish uchun yaratilgan. Jangga tayyorlanyapsizmi yoki mashg‘ulotdan keyin tiklanyapsizmi — Protron ichki kuchingizni ochishga yordam beradi.|Introducing Protron, the ultimate protein blend designed for any machine. Packed with a high-quality whey and casein protein blend, MCTs and digestive enzymes, the Protron supplement is designed to fuel your inner Autobot. Whether you’re ready to ramp up for battle or start the recovery process post workout, Protron can help you harness your power within.", "Смесь сывороточного белка и казеина;Добавлены MCT;Пищеварительные ферменты;Гурманский вкус|Zardob va kazein oqsili aralashmasi;MCT qo‘shilgan;Hazm fermentlari;Gurme ta’m|Whey/casein blend;Added MCTs;Digestive enzymes;Gourmet taste", "Вкус: PB Cookies ’n Cream · 907 г|Ta’mi: PB Cookies ’n Cream · 907 g|Flavor: PB Cookies ’n Cream · 907 g"]],
["Basic Isolate Whey Protein, 2,27 кг|Basic Isolate Whey Protein, 2,27 kg|Basic Isolate Whey Protein, 2.27 kg", 1750000, "bas", ["Чистый белок с кофейным вкусом|Qahva ta’mli toza oqsil|Clean protein with a coffee-inspired flavor profile", "Basic Isolate со вкусом солёной карамели и кольд брю — качественный изолят сывороточного белка и изысканный вкус. Формула для тех, кто хочет чистый источник белка без лишних жиров и наполнителей, но с более премиальным вкусом. Насыщенная карамельная сладость с лёгкими кофейными нотами делает коктейль легче и приятнее обычных вкусов, и ежедневный белок становится тем, чего ждёшь.|Tuzli karamel va cold brew ta’mli Basic Isolate — yuqori sifatli zardob oqsili izolyati va nafis ta’m uyg‘unligi. Ortiqcha yog‘ va to‘ldiruvchilarsiz toza oqsil manbasini, shu bilan birga premium ta’mni xohlovchilar uchun. Boy karamel shirinligi va yengil qahva notalari kokteylni odatiy ta’mlardan ajralib turadigan yengil va ichishga yoqimli qiladi — kundalik oqsil qabul qilish kutiladigan lahzaga aylanadi.|Basic Supplements Basic Isolate in Salted Caramel Cold Brew delivers a high quality whey protein isolate paired with a smooth, elevated flavor experience. This formula is built for those who want a clean protein source without unnecessary fats or fillers, while still enjoying a more premium taste. The combination of rich caramel sweetness with subtle coffee notes creates a lighter, more drinkable shake that stands out from traditional flavors, helping make daily protein intake something you actually look forward to.", "26 г белка в порции;Легче усваивается;Без гормона rBST;Проверен сторонней лабораторией;Всего 110 калорий|Bir porsiyada 26 g oqsil;Oson hazm bo‘ladi;rBST gormonisiz;Mustaqil laboratoriyada tekshirilgan;Atigi 110 kaloriya|26 g of protein per serving;Easier to digest;Hormone rBST free;Third-party lab tested;Only 110 calories", "Вкус: солёная карамель кольд брю · 2,27 кг (5 lb)|Ta’mi: tuzli karamel cold brew · 2,27 kg (5 lb)|Flavor: salted caramel cold brew · 2.27 kg (5 lb)"]]];

["Можно изменить заказ?|Buyurtmani o‘zgartirsa bo‘ladimi?|Can I change my order?","Да, пока он не передан в сборку — обычно 2 часа.|Ha, u yig‘ishga topshirilguncha — odatda 2 soat.|Yes, until it goes to packing — usually 2 hours."],

var PAGE={
contact:["Контакты|Aloqa|Contact","Почта: "+MAIL+"\nОтвечаем в течение рабочего дня.|Pochta: "+MAIL+"\nIsh kuni davomida javob beramiz.|Email: "+MAIL+"\nWe reply within one business day."],
terms:["Условия использования|Foydalanish shartlari|Terms of use","Оформляя заказ на сайте "+BRAND+", вы соглашаетесь с условиями продажи, доставки и возврата.|"+BRAND+" saytida buyurtma berish orqali siz sotuv, yetkazib berish va qaytarish shartlariga rozilik bildirasiz.|By placing an order on "+BRAND+", you agree to the terms of sale, delivery and returns."],
privacy:["Конфиденциальность|Maxfiylik|Privacy","Мы храним только данные, нужные для заказа, и не передаём их третьим лицам.|Biz faqat buyurtma uchun zarur ma’lumotlarni saqlaymiz va uchinchi shaxslarga bermaymiz.|We keep only the data needed for your order and never share it with third parties."],
cookies:["Cookies|Cookie fayllar|Cookies","Сайт использует cookies, чтобы запоминать язык и содержимое корзины.|Sayt tilni va savat tarkibini eslab qolish uchun cookie fayllardan foydalanadi.|The site uses cookies to remember your language and cart."]};
var UI={
sea:"SEASON 1|SEASON 1|SEASON 1",
ordq:"Номер заказа|Buyurtma raqami|Order number",
ordb:"Проверить|Tekshirish|Check",
ordn:"Заказ не найден. Проверьте номер в письме.|Buyurtma topilmadi. Raqamni xatdan tekshiring.|Order not found. Check the number in your email.",
ordt:"Введите номер из письма о заказе.|Buyurtma xatidagi raqamni kiriting.|Enter the number from your order email."};
var u=function(k){return T(UI[k])[L]};
var NAMES=["home","him","her","sport","care","delivery","faq","contact","terms","privacy","cookies","order"];
function sec(id,inner,cls){return '<section id="'+id+'"'+(cls?' class="'+cls+'"':'')+'>'+inner+'</section>'}
function txt(s){return s.replace(/\n/g,"<br>")}
function build(){
 var h=(location.hash||"#home").slice(1);if(NAMES.indexOf(h)<0)h="home";
 var out=sec("home",'<div class="hero blk"><div class="lw"><img alt="" src="'+IMG.home+'"><a class="z1" href="#him" aria-label="'+T(NAV[0][1])[L]+'"></a><a class="z2" href="#her" aria-label="'+T(NAV[1][1])[L]+'"></a></div><div class="sea">'+u("sea")+'</div></div>');
 ["him","her","sport","care"].forEach(function(k,i){
  out+=sec(k,'<h1>'+T(NAV[i][1])[L]+'</h1><div class="grid">'+PROD[k].map(function(p,j){
   return '<a class="card'+(k==="sport"?" jar":k==="care"?" bot":"")+'" href="#p-'+k+'-'+j+'">'+(p[2]?'<img alt="" src="'+IMG[p[2]]+'">':'<span class="shape"></span>')+'<span class="meta"><span>'+T(p[0])[L]+'</span><span>'+fmt(p[1])+'</span></span></a>'}).join("")+'</div>');
 });
 out+=sec("product","");
 out+=sec("delivery",'<h1>'+T(NAV[4][1])[L]+'</h1><div class="text">'+DEL.map(function(d){return '<h2>'+T(d[0])[L]+'</h2><p>'+T(d[1])[L]+'</p>'}).join("")+'</div>');
 out+=sec("faq",'<h1>FAQ</h1><dl>'+FAQ.map(function(d){return '<dt tabindex="0" role="button" aria-expanded="false">'+T(d[0])[L]+'</dt><dd>'+T(d[1])[L]+'</dd>'}).join("")+'</dl>');
 Object.keys(PAGE).forEach(function(k){out+=sec(k,'<h1>'+T(PAGE[k][0])[L]+'</h1><div class="text"><p>'+txt(T(PAGE[k][1])[L])+'</p>'+(k==="contact"?'<div class="cform"><input id="cn" aria-label="'+cc("nm")+'" placeholder="'+cc("nm")+'"><textarea id="cm" aria-label="'+cc("msg")+'" placeholder="'+cc("msg")+'"></textarea><button id="cs">'+cc("send")+'</button></div>':'')+'</div>')});
 out+=sec("order",'<h1>'+T(FOOT[4][1])[L]+'</h1><div class="text"><p>'+u("ordt")+'</p><div class="ord"><input id="oi" aria-label="'+u("ordq")+'" placeholder="'+u("ordq")+'"><button id="ob">'+u("ordb")+'</button></div><p id="om"></p></div>');
 document.getElementById("main").innerHTML=out;
 document.getElementById("nav").innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'">'+T(n[1])[L]+'</a>'}).join("");
 document.getElementById("foot").innerHTML=FOOT.map(function(n){return '<a href="#'+n[0]+'">'+T(n[1])[L]+'</a>'}).join("")+'<span>© 2026 '+BRAND+'</span>';
 document.querySelectorAll("dt").forEach(function(t){
  function tg(){t.setAttribute("aria-expanded",t.getAttribute("aria-expanded")!=="true")}
  t.onclick=tg;t.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tg()}};
 });
 var ob=document.getElementById("ob");
 if(ob)ob.onclick=function(){document.getElementById("om").textContent=document.getElementById("oi").value.trim()?u("ordn"):u("ordt")};
 show();
}
function renderProduct(k,j){
 var p=PROD[k][j],d=p[3],n=NAV.filter(function(x){return x[0]===k})[0],nm=T(p[0])[L];
 var cl=k==="sport"?" jar":k==="care"?" bot":"";
 var h='<a class="back" href="#'+k+'">← '+T(n[1])[L]+'</a><div class="pd"><div class="pimg'+cl+'">'+(p[2]?'<img alt="'+nm+'" src="'+IMG[p[2]]+'">':'<span class="shape"></span>')+'</div><div class="pinfo"><h1>'+nm+'</h1><p class="pp">'+fmt(p[1])+'</p>';
 if(d){h+='<h2>'+T(d[0])[L]+'</h2>';if(T(d[1])[L])h+='<p>'+T(d[1])[L]+'</p>';if(T(d[2])[L])h+='<ul>'+T(d[2])[L].split(";").map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>';if(T(d[3])[L])h+='<p class="sp">'+T(d[3])[L]+'</p>'}
 h+='<button class="pay" data-add="'+k+':'+j+'">'+cc("add")+'</button></div></div>';
 document.getElementById("product").innerHTML=h;
}
function setHH(){document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px")}
function show(){setHH();
 var h=(location.hash||"#home").slice(1),pm=/^p-([a-z]+)-(\d+)$/.exec(h),cat="";
 if(pm&&PROD[pm[1]]&&PROD[pm[1]][+pm[2]]){cat=pm[1];renderProduct(pm[1],+pm[2]);h="product"}else if(NAMES.indexOf(h)<0)h="home";
 document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===h)});
 document.querySelectorAll("nav a,footer a").forEach(function(a){
  if(a.getAttribute("href")==="#"+(cat||h))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 window.scrollTo(0,0);
}
function setLang(i){
 L=i;renderCart();document.documentElement.lang=["ru","uz","en"][i];
 document.getElementById("thumb").style.transform="translateX("+(i*100)+"%)";
 document.querySelectorAll("#lang button").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.l===i))});
 build();
}
document.querySelectorAll("#lang button").forEach(function(b){b.onclick=function(){setLang(+b.dataset.l)}});
window.addEventListener("hashchange",show);
var CART={},CO={
cart:"Корзина|Savat|Cart",add:"В корзину|Savatga|Add to cart",empty:"Корзина пуста.|Savat bo‘sh.|Your cart is empty.",total:"Итого|Jami|Total",pay:"Оформить заказ|Buyurtma berish|Checkout",soon:"Оплата пока не подключена.|To‘lov hali ulanmagan.|Payment is not connected yet.",close:"Закрыть|Yopish|Close",sum:"Ваш заказ|Buyurtmangiz|Order summary",sub:"Подытог|Oraliq jami|Subtotal",code:"Промокод|Promokod|Promo code",bad:"Код недействителен.|Kod yaroqsiz.|Invalid code.",nm:"Имя|Ism|Name",msg:"Сообщение|Xabar|Message",send:"Отправить|Yuborish|Send"};
function cc(k){return T(CO[k])[L]}
function item(id){var a=id.split(":");return PROD[a[0]][+a[1]]}
function renderCart(){
 var ids=Object.keys(CART),n=0,sum=0;
 var rows=ids.map(function(id){var p=item(id),q=CART[id];n+=q;sum+=q*p[1];
  return '<div class="row"><span>'+T(p[0])[L]+'<br><em>'+fmt(p[1])+'</em></span><span class="qty"><button data-d="-1" data-id="'+id+'" aria-label="−">−</button>'+q+'<button data-d="1" data-id="'+id+'" aria-label="+">+</button></span></div>'}).join("");
 var cb=document.getElementById("cartb");cb.setAttribute("aria-label",cc("cart"));cb.innerHTML='<svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="5.5" width="13" height="11" rx="2"/><path d="M5 8V4.5a3 3 0 0 1 6 0V8"/></svg>'+(n?'<span>'+n+'</span>':'');
 document.getElementById("cart").innerHTML='<div class="ch"><span>'+cc("sum")+'</span><button id="cx" aria-label="'+cc("close")+'">×</button></div><div class="cb">'+(rows||'<p class="em">'+cc("empty")+'</p>')+'</div>'+'<div class="cf"><div class="tot"><span>'+cc("sub")+'</span><span>'+fmt(sum)+'</span></div><div class="tot big"><span>'+cc("total")+'</span><span>'+fmt(sum)+'</span></div><button class="code" id="code">'+cc("code")+'</button><div id="cd"></div>'+(n?'<button class="pay" id="pay">'+cc("pay")+'</button>':'')+'<p id="pm"></p></div>';
}
function openCart(o){document.getElementById("cart").classList.toggle("open",o);document.getElementById("ov").classList.toggle("open",o)}
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.dataset.add){var id=t.dataset.add;CART[id]=(CART[id]||0)+1;renderCart();openCart(true)}
 else if(t.classList.contains("card")){var id=t.dataset.id;CART[id]=(CART[id]||0)+1;renderCart();openCart(true)}
 else if(t.id==="cartb")openCart(true);
 else if(t.id==="cx")openCart(false);
 else if(t.dataset.d){var k=t.dataset.id;CART[k]+=+t.dataset.d;if(CART[k]<1)delete CART[k];renderCart()}
 else if(t.id==="cs"){var cn=document.getElementById("cn").value.trim(),cm=document.getElementById("cm").value.trim();location.href="mailto:"+MAIL+"?subject="+encodeURIComponent(BRAND+" — "+cn)+"&body="+encodeURIComponent(cm)}
 else if(t.id==="pay")document.getElementById("pm").textContent=cc("soon");
 else if(t.id==="code")document.getElementById("cd").innerHTML='<div class="ord"><input id="ci" aria-label="'+cc("code")+'" placeholder="'+cc("code")+'"><button id="ca">OK</button></div>';
 else if(t.id==="ca")document.getElementById("pm").textContent=cc("bad");
});
document.getElementById("ov").onclick=function(){openCart(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")openCart(false)});
window.addEventListener("resize",setHH);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setHH);
var nl=(navigator.language||"ru").slice(0,2);
setLang(nl==="uz"?1:nl==="en"?2:0);
</script>
